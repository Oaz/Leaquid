name: publish-to-wasm

on:
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.x
      - name: Restore workloads
        run: dotnet workload restore
      - name: Build
        run: dotnet publish ./Leaquid.Browser/Leaquid.Browser.csproj -c Release
      - name: Fix permissions
        run: |
          chmod -c -R +rX "Leaquid.Browser/bin/Release/net10.0-browser/publish/wwwroot/" | while read line; do
            echo "::warning title=Invalid file permissions automatically fixed::$line"
          done
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Leaquid.Bundle
          path: Leaquid.Browser/bin/Release/net10.0-browser/publish/wwwroot/
